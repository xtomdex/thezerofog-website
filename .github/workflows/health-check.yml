# Production health check - every 30 minutes, from OUTSIDE our own infrastructure.
#
# Written 2026-08-29, the day the site served 503 for three hours and nobody knew.
# Netlify had blocked the account on exhausted plan credits (usage_exceeded); the ads
# kept spending into a dead page and the outage was found by hand, during a session
# close, by luck.
#
# It runs on GitHub Actions ON PURPOSE. A watchman living inside Netlify is asleep
# exactly when Netlify is the thing that broke, and a launchd job on a laptop is asleep
# when the laptop is. This runs whether or not anything of ours is up.
#
# It checks what a real visitor and a real buyer need, not just that a server answered:
#   1. the landing page returns 200
#   2. the schedule step returns 200 (the funnel's second door)
#   3. create-checkout still mints a LIVE Stripe session (cs_live_) - the mode is proven,
#      never read from config, per the project's standing rule
#   4. the workshop room endpoint answers (its own function, separate from the pages)
#
# Any failure pushes a Telegram alert to the operator channel (@zerofog_alerts_bot) and
# fails the run. When a run passes after a failed one, it pushes a recovery note, so the
# channel says both "it broke" and "it is back" without anyone asking.
#
# Cron note: GitHub delays scheduled runs under load, so 30 minutes is a floor, not a
# guarantee. Good enough for an outage alarm; it is not an SLA monitor.

name: health-check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Fire a test alert to Telegram without breaking anything'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production
        id: probe
        run: |
          FAILURES=""

          check_code() {
            local url="$1" want="$2" label="$3"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$url" || echo "000")
            echo "$label: $code"
            if [ "$code" != "$want" ]; then
              FAILURES="${FAILURES}
          - ${label} returned ${code} (expected ${want}) - ${url}"
            fi
          }

          check_code "https://thezerofog.com/" 200 "landing"
          check_code "https://thezerofog.com/workshop/schedule/" 200 "schedule"
          check_code "https://thezerofog.com/.netlify/functions/wr-slots?tz=UTC" 200 "wr-slots"

          # Stripe live mode: prove it by minting a session, never by reading config.
          #
          # But minting one every 30 minutes creates ~48 junk Checkout Sessions a day in the
          # real Stripe account (~1,400 a month) and burns two Netlify function invocations
          # each - create-checkout now, plus the checkout.session.expired webhook two hours
          # later. On the day exhausted Netlify credits took the whole site down, a monitor
          # that adds ~5,800 invocations a month is the wrong trade. So the cheap checks run
          # every 30 minutes and this one runs on the even hour: outage detection stays at
          # 30-minute granularity, Stripe junk drops fourfold.
          #
          # It sends no email, so the expired session cannot trigger the E18 recovery note
          # (stripe-webhook.js only sends when the session captured an address).
          HOUR=$(date -u +%H)
          if [ $((10#$HOUR % 2)) -eq 0 ]; then
            CHECKOUT=$(curl -s --max-time 30 -X POST \
              https://thezerofog.com/.netlify/functions/create-checkout \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://thezerofog.com' \
              -d '{}' || echo "")
            if echo "$CHECKOUT" | grep -q 'cs_live_'; then
              echo "checkout: cs_live_ ok"
            else
              echo "checkout: FAILED"
              FAILURES="${FAILURES}
          - create-checkout did not return a cs_live_ session (payments may be dead)"
            fi
          else
            echo "checkout: skipped (odd hour - runs every 2h to keep Stripe clean)"
          fi

          if [ -n "$FAILURES" ]; then
            {
              echo "failed=true"
              echo "detail<<EOF"
              echo "$FAILURES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      # An alarm nobody has ever heard is not an alarm. This proves the whole pipe -
      # repo secret, bot, chat id, delivery - without waiting for a real outage.
      - name: Test alert (manual only)
        if: inputs.test_alert
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="TEST - this is the health-check alarm, fired by hand at $(date -u '+%H:%M UTC').
          Nothing is wrong. If you can read this, a real outage will reach you the same way."
          RESP=$(curl -s --max-time 20 -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" --data-urlencode "text=${TEXT}")
          # Telegram answers 200 with {"ok":false} on a bad token or chat id. Swallowing
          # that reply is how an alarm becomes decorative - so the delivery is asserted.
          echo "$RESP" | grep -q '"ok":true' || { echo "TELEGRAM DELIVERY FAILED: $RESP"; exit 1; }
          echo "test alert sent"

      - name: Was the previous run already failing?
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Best effort: never let this step break the check itself.
          PREV=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/health-check.yml/runs?status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion' 2>/dev/null || echo "unknown")
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "previous run: $PREV"

      - name: Alert Telegram on failure
        if: steps.probe.outputs.failed == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Passed through env, never interpolated straight into the shell string: a
          # `${{ }}` expansion lands in the script before bash sees it, so any backtick or
          # $(...) in it would execute. Ours is built from our own hardcoded URLs today, but
          # the pattern is one edit away from being a hole.
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: |
          TEXT="SITE DOWN - thezerofog.com${DETAIL}

          Checked from GitHub Actions at $(date -u '+%Y-%m-%d %H:%M UTC').
          If every check failed at once, look at Netlify billing first - plan credits
          running out blocks the whole account and returns 503 on every page.
          Ads keep spending while this is down."
          RESP=$(curl -s --max-time 20 -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" --data-urlencode "text=${TEXT}")
          # Telegram answers 200 with {"ok":false} on a bad token or chat id. Swallowing
          # that reply is how an alarm becomes decorative - so the delivery is asserted.
          echo "$RESP" | grep -q '"ok":true' || { echo "TELEGRAM DELIVERY FAILED: $RESP"; exit 1; }
          echo "alert sent"

      - name: Tell Telegram it recovered
        if: steps.probe.outputs.failed == 'false' && steps.prev.outputs.previous == 'failure'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="RECOVERED - thezerofog.com is answering again ($(date -u '+%H:%M UTC')).
          Landing, schedule, wr-slots and a live Stripe session all check out."
          RESP=$(curl -s --max-time 20 -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" --data-urlencode "text=${TEXT}")
          # Telegram answers 200 with {"ok":false} on a bad token or chat id. Swallowing
          # that reply is how an alarm becomes decorative - so the delivery is asserted.
          echo "$RESP" | grep -q '"ok":true' || { echo "TELEGRAM DELIVERY FAILED: $RESP"; exit 1; }
          echo "recovery note sent"

      - name: Fail the run if production is broken
        if: steps.probe.outputs.failed == 'true'
        run: exit 1
