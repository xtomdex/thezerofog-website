[build]
  command = "rm -rf dist && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Netlify asset optimization is buggy: it appended a corrupted, unscoped copy of
# the trailing @media rules to sales.css (2026-07-09) and again to sales-3.css
# (2026-07-11), breaking desktop layout. We don't use its bundling/minification,
# so skip post-processing entirely — live files must be byte-identical to git.
[build.processing]
  skip_processing = true

# CSS and JS are referenced with a `?v=<hash>` of their own bytes (the `v` filter in
# .eleventy.js), so a changed file is a changed URL and a year of `immutable` is honest.
#
# It was not honest before 2026-08-14: the same header sat on unversioned filenames, and
# `immutable` means the browser will not revalidate even on an ordinary reload. Every style and
# script fix we shipped was invisible to anyone who had visited the site before. That was
# measured, not suspected - a deployed fix did not reach the page until a hard reload.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The rest of /assets - images, video, caption tracks. These are referenced from inside CSS (the
# replay poster) and from JS, where no filter can add a version, so they must stay revalidatable.
# A conditional request per file is nothing at this traffic; serving a year-old caption track
# nobody can replace is not.
#
# Listed one directory at a time on purpose. A catch-all `/assets/*` would also match the two
# rules above, and which of two overlapping rules wins is not something to leave to guesswork.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    # A day, not a year: image URLs carry no version, so long immutable caching would pin a
    # stale replay poster. stale-while-revalidate keeps repeat views instant anyway.
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/captions/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Fonts are the one thing under /assets that can honestly keep `immutable` without the `| v`
# filter: they are referenced from inside CSS, where no template filter reaches, so the version
# is carried in the filename itself (inter-var-latin.v1.woff2). A new cut means a new name, and
# the old one is never re-fetched.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# === Redirects ===
# Single source of truth — there is no _redirects file (it took precedence over
# this section in the Netlify processing order, so keeping both would shadow
# these rules).

# Single stable checkout entry point used by EVERY sales email CTA and by ads.
# Emails point at /enroll/ forever; when the founding window closes, or if the
# checkout mechanism changes, only these two rules move - not 8 emails, the sales
# page and any live campaign. Currently: the sales page anchor that opens the
# Stripe Checkout session (create-checkout function).
[[redirects]]
  from = "/enroll"
  to = "/sales/#enroll"
  status = 302
  force = true

[[redirects]]
  from = "/enroll/"
  to = "/sales/#enroll"
  status = 302
  force = true

# Marketing short-link → Systeme.io course on platform. subdomain
# (LMS URL can't be shortened natively)
[[redirects]]
  from = "/course"
  to = "https://platform.thezerofog.com/school/course/tzf-main"
  status = 301
  force = true

[[redirects]]
  from = "/course/"
  to = "https://platform.thezerofog.com/school/course/tzf-main"
  status = 301
  force = true

# Instagram bio link. The profile shows a clean /ig; the utm tail is added here
# so nobody sees a tracking string in the bio. Set on the profile 2026-08-23.
[[redirects]]
  from = "/ig"
  to = "/?utm_source=instagram&utm_medium=bio&utm_campaign=profile"
  status = 301
  force = true

[[redirects]]
  from = "/ig/"
  to = "/?utm_source=instagram&utm_medium=bio&utm_campaign=profile"
  status = 301
  force = true

# Legacy /social and retired /waitlist pages → home
# (waitlist page removed 2026-07-09; sources archived in archive/waitlist-page/)
[[redirects]]
  from = "/social"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/social/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/waitlist"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/waitlist/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/waitlist-confirmed"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/waitlist-confirmed/"
  to = "/"
  status = 301
  force = true

# Retired bonus PDFs → the app
# (PDFs removed 2026-07-10; the standalone /webinar-bonuses/ page was retired
# 2026-07-27 and the app is now the single home for the bonuses. /app/ opens
# with no login for non-buyers and lands on them.
# Sleep-Diary-dark/light.pdf stay — they are course materials, not bonuses.)
[[redirects]]
  from = "/downloads/Caffeine-Blueprint.pdf"
  to = "/app/"
  status = 301
  force = true

[[redirects]]
  from = "/downloads/Recovery-Protocol.pdf"
  to = "/app/"
  status = 301
  force = true

[[redirects]]
  from = "/downloads/9-Recovery-Mistakes.pdf"
  to = "/app/"
  status = 301
  force = true

# Legacy singular /refund → /refunds (plural)
[[redirects]]
  from = "/refund"
  to = "/refunds/"
  status = 301

# Old post-purchase page renamed: /thank-you → /welcome
[[redirects]]
  from = "/thank-you"
  to = "/welcome/"
  status = 301

[[redirects]]
  from = "/thank-you/"
  to = "/welcome/"
  status = 301

# Retired standalone bonuses page → the app (2026-07-27)
[[redirects]]
  from = "/webinar-bonuses/*"
  to = "/app/"
  status = 301
  force = true

# The free offer is a workshop, not a webinar (CEO 2026-08-11). Routes renamed
# so nothing in the funnel shows the old word in the address bar. These 301s
# keep every link already sent out alive — /webinar-bonuses above is matched
# first by its own rule, so it still lands on /app/.
#
# /workshop/ itself is gone (CEO 2026-08-14). It was the old evergreen replay
# page: the whole workshop on an unlisted YouTube embed, no registration, the
# $67 button underneath — and the cut it carried was three weeks older than the
# master the room plays. It bypassed the session model entirely, so anyone
# holding an old /webinar link watched the wrong video and was never segmented.
# These now enter the funnel at the top instead. Exact paths only: /workshop/room/
# and /workshop/schedule/ are separate rules to Netlify and are untouched.
[[redirects]]
  from = "/webinar"
  to = "/"
  status = 301

[[redirects]]
  from = "/webinar/"
  to = "/"
  status = 301

[[redirects]]
  from = "/workshop"
  to = "/"
  status = 301

[[redirects]]
  from = "/workshop/"
  to = "/"
  status = 301

[[redirects]]
  from = "/webinar-text"
  to = "/workshop-text/"
  status = 301

[[redirects]]
  from = "/webinar-text/*"
  to = "/workshop-text/:splat"
  status = 301
